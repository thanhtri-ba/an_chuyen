name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Backend
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npm run lint --if-present

      - name: Type check backend
        run: cd backend && npx tsc --noEmit

      # Web Frontend
      - name: Install web dependencies
        run: cd web && npm ci

      - name: Lint web
        run: cd web && npm run lint --if-present

      - name: Type check web
        run: cd web && npx tsc --noEmit

      # Admin Dashboard
      - name: Install admin dependencies
        run: cd admin && npm ci

      - name: Lint admin
        run: cd admin && npm run lint --if-present

      - name: Type check admin
        run: cd admin && npx tsc --noEmit

  build:
    name: Build
    needs: lint-and-type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Backend Build
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Build backend
        run: cd backend && npm run build

      # Web Frontend Build
      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build web
        run: cd web && npm run build

      # Admin Dashboard Build
      - name: Install admin dependencies
        run: cd admin && npm ci

      - name: Build admin
        run: cd admin && npm run build

  test:
    name: Tests
    needs: lint-and-type-check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: busz_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm run test --if-present
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/busz_test
          NODE_ENV: test

      - name: Run backend load tests
        run: cd backend && npm run load:test --if-present
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/busz_test
          NODE_ENV: test
        continue-on-error: true

  docker-build:
    name: Docker Build
    needs: [lint-and-type-check, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker-compose config
          docker-compose build

      - name: Run docker-compose
        run: docker-compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Check service health
        run: |
          docker-compose ps
          curl http://localhost:3000/api/health || true

      - name: Stop services
        run: docker-compose down
