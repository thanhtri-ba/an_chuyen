
version: '3.8'
services:
  card-service:
    build: ./card-service
    ports:
      - '8080:8080'
    depends_on:
      - db
  signer-service:
    build: ./signer-service
    ports:
      - '8081:8080'
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: busz_card
    ports:
      - '5432:5432'
